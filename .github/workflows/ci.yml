name: CI Pipeline

on:
  push:
    branches:
      - develop
      - test
      - production
      - 'feature/**'
      - 'agent/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - develop
      - test
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-verification:
    name: JavaScript Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Go (For E2E Server Orchestration)
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Verify JavaScript Syntax
        run: |
          node --check app.js
          node --check theme-init.js
          node --check test_dashboard.js
          node --check test_e2e.js

      - name: Run Unit Tests & Collect Coverage
        run: |
          node --test --experimental-test-coverage test_dashboard.js > test_output.txt 2>&1 || true
          cat test_output.txt
          echo "### 📊 Automated Test & Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node --test test_dashboard.js

      - name: Run E2E Integration & DOM Lifecycle Tests
        run: node --test test_e2e.js

  golang-lint-and-sast:
    name: Go Static Analysis & SAST (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Verify Go Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Unformatted Go files found:"
            gofmt -s -l .
            exit 1
          fi

      - name: Go Vet Analysis
        run: go vet ./...

      - name: Multi-Linter Analysis (staticcheck, revive, errcheck, ineffassign)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/mgechev/revive@latest
          go install github.com/kisielk/errcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
          staticcheck ./...
          revive ./...
          errcheck ./...
          ineffassign ./...

      - name: Go Vulnerability & Security SAST Scan (govulncheck & gosec)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          govulncheck ./...
          gosec ./...

      - name: Run Go Micro-Benchmarks & Latency Regression Check
        run: go test -bench=Benchmark -benchmem -run=^$ ./...

  golang-cross-platform:
    name: Go Cross-Platform Matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Run Go Unit, Fuzz & Security Tests
        run: go test -v ./...

      - name: Compile Cross-Platform Binary
        run: go build -v ./...
