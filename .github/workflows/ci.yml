name: CI Pipeline

on:
  push:
    branches:
      - develop
      - test
      - production
      - 'feature/**'
      - 'agent/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - develop
      - test
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-verification:
    name: JavaScript Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript Syntax
        run: |
          node --check app.js
          node --check theme-init.js

      - name: Run Unit Tests & Collect Coverage
        run: |
          node --test --experimental-test-coverage test_dashboard.js > test_output.txt 2>&1 || true
          cat test_output.txt
          echo "### 📊 Automated Test & Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node --test test_dashboard.js

  golang-verification:
    name: Go Static Analysis & Multi-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Unformatted Go files found:"
            gofmt -s -l .
            exit 1
          fi

      - name: Go Vet Analysis
        run: go vet ./...

      - name: Multi-Linter Analysis (staticcheck, revive, errcheck, ineffassign)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/mgechev/revive@latest
          go install github.com/kisielk/errcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
          staticcheck ./...
          revive ./...
          errcheck ./...
          ineffassign ./...

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

      - name: Go Vulnerability & Security SAST Scan (govulncheck & gosec)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          govulncheck ./...
          gosec ./...

      - name: Compile Binary
        run: go build -v ./...
