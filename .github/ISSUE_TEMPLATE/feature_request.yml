name: Feature Request
description: Propose a new feature or enhancement for the dashboard
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the proposed feature and why it would be beneficial.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem or specific use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
